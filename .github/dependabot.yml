version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:security"
    # Versions are pinned exactly on purpose (see docs/DEPENDENCIES.md), so
    # Dependabot proposes concrete bumps rather than widening ranges.
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "type:security"

  - package-ecosystem: uv
    directory: /python/openmurmur_audio
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:security"
